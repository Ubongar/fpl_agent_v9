name: CI

# Why this file exists: the repo had zero CI before this. That is why the
# PuLP 4.0 incompatibility (LpVariable.dicts() removed, LpVariable(...)
# itself rewritten onto a Rust core) went unnoticed -- a plain
# `pip install -r requirements.txt` on a fresh machine silently pulled a
# breaking major version and nothing caught it until someone ran the
# `demo` command by hand. Two jobs guard against that class of bug:
#
#   backend: fresh `pip install -r requirements.txt`, then BOTH the unit
#            suite (fast, isolated) and the full `fplagent demo` pipeline
#            (slow, but the only thing that actually exercises the ILP
#            optimisers end to end -- pytest's 30 tests did not touch
#            `optimise_squad` with a real PuLP install, which is exactly
#            how the 4.0 break shipped unnoticed).
#   dashboard: typecheck, lint and build the Next.js app on its own pinned
#              lockfile so a frontend/backend contract drift shows up as a
#              CI failure instead of a runtime 500 in someone's browser.
#
# Both jobs run on every push and PR to main, and on a weekly schedule so a
# newly released, unpinned-in-the-future dependency is caught even on a
# week with no commits.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 6 * * 1"  # Mondays 06:00 UTC
  workflow_dispatch: {}

jobs:
  backend:
    strategy:
      fail-fast: false
      matrix:
        # Both PuLP generations are supported (see optimizers/_lp.py), and
        # requirements.txt no longer pins an upper bound, so CI runs both
        # instead of only whichever one `pip` happens to resolve today. A
        # regression on either side -- a fix for 4.x that quietly breaks 3.x,
        # or the reverse -- fails here instead of shipping.
        pulp: ["3.3.2", "latest"]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install (fresh, exactly as a new contributor would)
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e .

      - name: Pin PuLP for this matrix leg
        if: matrix.pulp != 'latest'
        run: pip install "pulp==${{ matrix.pulp }}"

      - name: Report which PuLP generation this leg is actually running
        run: python -c "from fplagent.optimizers import _lp; print('PuLP', _lp.version(), '| is_v4:', _lp.is_v4())"

      - name: Doctor
        run: python -m fplagent.cli doctor

      - name: Init demo DB
        run: python -m fplagent.cli init-db

      - name: Full offline pipeline (ingest -> predict -> backtest -> optimise)
        run: python -m fplagent.cli demo

      # Runs AFTER the demo on purpose: the API integration tests read the
      # demo database it builds. Before the demo they skip instead of running.
      - name: Tests
        run: pytest -q

  dashboard:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dashboard
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: dashboard/package-lock.json

      - name: Install (from the committed lockfile, not floating ranges)
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build
