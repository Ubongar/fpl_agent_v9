[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fpl-agent"
version = "9.1.0"
description = "Probabilistic Fantasy Premier League prediction, simulation and optimisation system"
requires-python = ">=3.11"

dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "pandas>=2.1",
    "SQLAlchemy>=2.0",
    "requests>=2.31",
    "python-dotenv>=1.0",
    "PuLP>=3.3.2",
    "scikit-learn>=1.3",
    "psycopg2-binary>=2.9",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "rapidfuzz>=3.6",
    "beautifulsoup4>=4.12",
    "alembic>=1.13",
    "streamlit>=1.31",
    "plotly>=5.18",
    "openai>=1.12",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[tool.setuptools.packages.find]
include = ["fplagent", "fplagent.*"]